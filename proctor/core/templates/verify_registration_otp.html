{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify OTP – Smart Face Proctor</title>
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
  <div class="card w-100" style="max-width: 900px;">
    <div class="d-none d-lg-flex p-4" style="background-color: #f3f4ff;">
      <img src="{% static 'images/logo3.jpeg' %}" alt="Smart Face Logo" class="logo-big">
    </div>

    <div class="card-body">
      <div class="d-lg-none text-center mb-4">
        <img src="{% static 'images/logo3.jpeg' %}" alt="Smart Face Proctor" class="logo-img mb-2" />
        <h2 class="brand">Smart Face Proctor</h2>
      </div>

      <div class="d-none d-lg-block text-center mb-4">
        <h2 class="brand">Verify OTP</h2>
      </div>

      {% if messages %}
      <div class="alert-container">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      </div>
      {% endif %}

      <div class="alert alert-info mb-4">
        <i class="bi bi-info-circle"></i> We've sent a 6-digit OTP to <strong>{{ email }}</strong>
      </div>

      <form action="{% url 'verify_registration_otp' %}" method="post">
        {% csrf_token %}
        
        <div class="mb-3">
          <label for="otp" class="form-label">Enter OTP</label>
          <input type="text" class="form-control form-control-lg text-center" 
                 id="otp" name="otp" maxlength="6" pattern="\d{6}" 
                 placeholder="000000" required autofocus />
          <small class="form-text text-muted">OTP is valid for 15 minutes</small>
        </div>

        <div class="d-grid gap-2 mb-3">
          <button class="btn btn-primary btn-lg" type="submit">Verify & Complete Registration</button>
        </div>

        <div class="text-center small">
          Didn't receive OTP? <a href="{% url 'register' %}">Resend</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Auto-focus and format OTP input
    document.getElementById('otp').addEventListener('input', function(e) {
      this.value = this.value.replace(/\D/g, '');
    });
  </script>
</body>
</html>
